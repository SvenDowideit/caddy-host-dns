options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	allow-transfer { any; };
	allow-update { key "e2e-key"; };
	recursion no;
	dnssec-validation no;
	// Log query/update activity so `docker exec ... cat` can show it.
	querylog yes;
};

key "e2e-key" {
	algorithm hmac-sha256;
	secret "cWnu6Ju9zOki4f7Q+da2KKGo0KOXbCf6Pej6hW3geC4=";
};

zone "example.com" IN {
	type master;
	file "/var/cache/bind/db.example.com";
	allow-update { key "e2e-key"; };
};

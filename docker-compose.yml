# Local DNS servers for provider conformance tests.
#
# PowerDNS (profile "powerdns", started by default):
#   API at http://127.0.0.1:8081 with api-key "secret", matching the defaults of
#   github.com/libdns/powerdns. NOTE: the upstream libdns/powerdns provider has a
#   known TXT read-path bug and fails the suite's TXT cases; see README.
#
# BIND (profile "bind"): a local authoritative server with RFC2136 dynamic
#   updates over TSIG, for github.com/libdns/rfc2136. It passes the full suite.
#   DNS at 127.0.0.1:5354, TSIG key "rfc2136-key".
#
# WARNING: the suite creates and deletes records named "test-*". Use a dedicated
# test zone only.

services:
  powerdns:
    image: powerdns/pdns-auth-49
    networks:
      - backend
    volumes:
      - ./.docker/pdns:/etc/powerdns/pdns.d
    ports:
      - 8081:8081

  bind:
    image: internetsystemsconsortium/bind9:9.18
    profiles: ["bind"]
    networks:
      - backend
    volumes:
      - ./.docker/bind/named.conf:/etc/bind/named.conf:ro
      - ./.docker/bind/tsig.key:/etc/bind/tsig.key:ro
      - ./.docker/bind/zones.conf:/etc/bind/zones.conf:ro
      - ./.docker/bind/zones:/var/cache/bind
    ports:
      - 5354:53
      - 5354:53/udp

networks:
  backend: {}
